<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ea">
  <meta name="description" content="郑家大院的三维模型、楼层剖切和家具布置参考。">
  <title>郑家大院 · 三维装修参考</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <link rel="preload" as="image" href="./assets/drawings/floor-plan-1.png">
  <link rel="preload" as="image" href="./assets/drawings/floor-plan-2.png">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./viewer.js"></script>
</head>
<body>
  <div id="viewer-surface">
    <div id="viewport" hidden>
      <div class="labels" id="labels" aria-hidden="true"></div>
    </div>
  </div>
  <header class="masthead">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <div><h1>郑家大院</h1><p>三维装修参考</p></div>
    </div>
    <button class="outline-button" id="about-open" type="button" aria-haspopup="dialog" aria-controls="about">图纸与尺寸</button>
    <div class="explore-header" id="explore-header" hidden>
      <p id="explore-hint" class="desktop-hint">
        <span>WASD 移动 · ↑↓ 或滚轮升降 · Shift 加速</span>
        <span>拖动环顾 · 点击物品或按 Enter · 双击锁定鼠标，Esc 释放</span>
      </p>
      <button class="explore-reset" id="explore-reset" type="button" aria-label="回到入口" title="回到入口">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="6.5"/>
          <circle cx="12" cy="12" r="2"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="workbench">
    <section class="view" aria-label="郑家大院三维查看器">
      <div class="toolbar" data-model-controls inert>
        <div class="modes" role="group" aria-label="视图">
          <button type="button" data-mode="exterior" aria-pressed="true">整栋</button>
          <button type="button" data-mode="exploded" aria-pressed="false">逐层展开</button>
          <button type="button" data-mode="cut" aria-pressed="false">单层剖切</button>
          <button type="button" data-mode="plan" aria-pressed="false">平面</button>
          <button type="button" data-mode="explore" aria-pressed="false" disabled>自由探索</button>
        </div>
        <div class="view-actions">
          <button type="button" class="outline-button icon-button measure" id="measure" aria-pressed="false" aria-label="量尺寸" title="量尺寸">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-40 12 12)"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M7 8v3m5-3v4m5-4v3"/></g></svg>
          </button>
          <button type="button" class="outline-button" id="phone-settings-open" aria-haspopup="dialog" aria-controls="phone-settings">楼层与布置</button>
        </div>
      </div>

      <div class="stage" id="stage" aria-label="三维模型视口" data-model="loading" data-packed-model="" data-packed-bytes="">
        <div class="model-loading" id="model-loading">
          <div class="loading-meter">
            <div class="loading-meta">
              <span id="loading-status" role="status">正在准备写实模型…</span>
              <span id="loading-percent" aria-hidden="true"></span>
            </div>
            <progress id="loading-progress" max="100" aria-label="写实模型下载进度"></progress>
          </div>
        </div>
        <div id="model-view" aria-busy="true" hidden>
          <div class="view-caption">
            <span class="scene-index" id="scene-index">整栋</span>
            <p id="scene-text">主屋与庭院</p>
            <span id="model-note" class="model-note" role="status"></span>
            <button type="button" class="outline-button model-retry" id="model-retry" hidden>重试写实模型</button>
          </div>
          <div class="compass" aria-hidden="true"><span>北</span><i id="north-arrow"></i></div>
          <div class="camera-controls" role="group" aria-label="相机控制" data-model-controls inert>
            <button type="button" id="zoom-in" title="放大" aria-label="放大">＋</button>
            <button type="button" id="zoom-out" title="缩小" aria-label="缩小">−</button>
            <button type="button" id="reset-view" title="复位视角" aria-label="复位视角">↺</button>
          </div>
          <div class="explore-hud" id="explore-hud" hidden>
            <div class="explore-reticle" id="explore-reticle" aria-hidden="true" hidden></div>
            <div class="visually-hidden" id="explore-feedback" role="status"></div>
            <div class="fly-controls fly-directions" role="group" aria-label="前后左右移动">
              <button type="button" data-fly="forward" aria-label="向前">↑</button>
              <button type="button" data-fly="left" aria-label="向左">←</button>
              <button type="button" data-fly="back" aria-label="向后">↓</button>
              <button type="button" data-fly="right" aria-label="向右">→</button>
            </div>
            <div class="fly-controls fly-height" role="group" aria-label="升降视角">
              <button type="button" data-fly="up" aria-label="上升">升</button>
              <button type="button" data-fly="down" aria-label="下降">降</button>
            </div>
          </div>
          <div id="view-status" class="view-status" role="status" hidden></div>
        </div>
        <div id="view-error" class="view-error" hidden></div>
      </div>
      <div class="view-footer">
        <p id="view-hint">拖动旋转 · 滚动缩放 · 右键拖动平移</p>
        <p id="explore-detail" role="status" hidden></p>
        <p class="unit">米制模型 <span>1 m = 1 m</span></p>
      </div>
    </section>

    <aside class="inspector" id="inspector" aria-label="楼层和布置设置" data-model-controls inert>
      <section class="inspector-section layers">
        <div class="section-heading"><h2>楼层</h2><span id="floor-elevation">±0.000</span></div>
        <div class="layer-list" role="group" aria-label="楼层">
          <button type="button" data-floor="ground" aria-pressed="true"><span class="floor-tag">1F</span><span><b>一层</b><small>客餐厅与卧室</small></span><i aria-hidden="true">›</i></button>
          <button type="button" data-floor="upper" aria-pressed="false"><span class="floor-tag">2F</span><span><b>二层</b><small>茶室、书房与儿童区</small></span><i aria-hidden="true">›</i></button>
          <button type="button" data-floor="roof" aria-pressed="false"><span class="floor-tag">屋面</span><span><b>屋顶</b><small>十字坡屋面</small></span><i aria-hidden="true">›</i></button>
          <button type="button" data-floor="yard" aria-pressed="false"><span class="floor-tag">室外</span><span><b>庭院</b><small>花园与室外厨房</small></span><i aria-hidden="true">›</i></button>
        </div>
      </section>

      <section class="inspector-section display-options">
        <div class="section-heading"><h2>显示设置</h2></div>
        <label class="field" for="yard-phase"><span>庭院</span><select id="yard-phase"><option value="proposal">施工方案</option><option value="present">施工阶段示意</option></select></label>
        <div class="switches">
          <label><input id="furniture-visibility" type="checkbox" checked>家具</label>
          <label><input id="room-visibility" type="checkbox" checked>房间标注</label>
        </div>
        <label class="field spacing" id="spacing-field" for="spacing" hidden><span>层间距</span><input id="spacing" type="range" min="1.8" max="4.2" step="0.1" value="2.6"><output id="spacing-value" for="spacing">2.6 m</output></label>
      </section>

      <section class="inspector-section layout-options" id="layout-options">
        <div class="section-heading"><h2>家具布置</h2><button type="button" class="text-button" id="reset-layout" disabled>恢复图纸</button></div>
        <label class="visually-hidden" for="item-select">选择家具</label>
        <select id="item-select" class="item-select"><option value="">选择一件家具</option></select>
        <p class="layout-note" id="layout-note">选择后可在单层或平面视图中拖动。调整保存在本机浏览器。</p>
        <div id="item-editor" hidden>
          <p class="item-detail" id="item-detail"></p>
          <div class="item-controls" role="group" aria-label="移动家具 10 厘米或旋转 90 度">
            <button class="outline-button" type="button" data-nudge="north" aria-label="向北移动10厘米">↑</button>
            <button class="outline-button" type="button" data-nudge="west" aria-label="向西移动10厘米">←</button>
            <button class="outline-button" type="button" data-nudge="south" aria-label="向南移动10厘米">↓</button>
            <button class="outline-button" type="button" data-nudge="east" aria-label="向东移动10厘米">→</button>
            <button class="outline-button rotate" type="button" id="rotate-item">旋转 90°</button>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <dialog id="phone-settings" aria-labelledby="phone-settings-title">
    <div class="dialog-heading phone-settings-heading">
      <h2 id="phone-settings-title">楼层与布置</h2>
      <form method="dialog">
        <button type="submit" class="outline-button icon-button" aria-label="关闭" title="关闭" autofocus>
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </form>
    </div>
  </dialog>

  <dialog id="about" aria-labelledby="about-title">
    <div class="dialog-heading">
      <h2 id="about-title">图纸与尺寸</h2>
      <div class="drawing-actions">
        <button type="button" class="outline-button icon-button" id="drawing-zoom" aria-controls="drawing-scroll" aria-pressed="false" aria-label="放大" title="放大或还原">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.3 15.3 5 5M7.5 10.5h6"/><path class="zoom-plus" d="M10.5 7.5v6"/></svg>
        </button>
        <form method="dialog">
          <button type="submit" class="outline-button icon-button" aria-label="关闭" title="关闭" autofocus>
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </form>
      </div>
    </div>
    <div id="drawing-scroll" class="drawing-scroll" role="region" aria-label="建筑设计方案图纸" tabindex="0">
      <div class="drawing-pages">
        <figure class="drawing-sheet">
          <img src="./assets/drawings/floor-plan-1.png" width="2646" height="3742" alt="一层的房间布局与尺寸标注">
          <figcaption><span>一层平面图</span><small>1:50</small></figcaption>
        </figure>
        <figure class="drawing-sheet">
          <img src="./assets/drawings/floor-plan-2.png" width="2646" height="3742" alt="二层的房间布局与尺寸标注">
          <figcaption><span>二层平面图</span><small>1:50</small></figcaption>
        </figure>
      </div>
    </div>
  </dialog>
  <script>
    const drawingsDialog = document.getElementById('about');
    const drawingZoom = document.getElementById('drawing-zoom');
    document.getElementById('about-open').addEventListener('click', () => drawingsDialog.showModal());
    drawingZoom.addEventListener('click', () => {
      const zoomed = drawingZoom.getAttribute('aria-pressed') === 'true';
      drawingZoom.setAttribute('aria-pressed', String(!zoomed));
    });
    drawingsDialog.addEventListener('close', () => {
      drawingZoom.setAttribute('aria-pressed', 'false');
      document.getElementById('drawing-scroll').scrollTo(0, 0);
    });
  </script>
</body>
</html>
